<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!--
    Helm — 扩展图标源文件
    设计：深青圆角方块 + 白色粗体 H
    简洁、高对比度，16px 仍清晰可辨。
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0F766E"/>
      <stop offset="1" stop-color="#0B5F58"/>
    </linearGradient>
  </defs>

  <!-- 底色圆角方块 -->
  <rect x="4" y="4" width="120" height="120" rx="24" fill="url(#bg)"/>

  <!-- 白色 H -->
  <text x="64" y="92" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
        font-size="80" font-weight="800" fill="#FFFFFF" text-anchor="middle">H</text>
</svg>
