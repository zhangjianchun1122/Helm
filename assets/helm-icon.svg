<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!--
    Helm — 扩展图标源文件
    设计：罗盘指针嵌入浏览器窗口轮廓，呼应"领航员"隐喻。
    - 深青背景圆角块 = 扩展图标底色
    - 窗口轮廓 = 浏览器
    - 罗盘指针 = 导航/操作方向（琥珀色强调）
    生成 16/48/128px：可直接 scale 此 SVG。
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0F766E"/>
      <stop offset="1" stop-color="#0B5F58"/>
    </linearGradient>
  </defs>

  <!-- 底色圆角方块 -->
  <rect x="4" y="4" width="120" height="120" rx="24" fill="url(#bg)"/>

  <!-- 浏览器窗口轮廓（白色细线） -->
  <rect x="24" y="28" width="80" height="72" rx="8"
        fill="none" stroke="#E2E8F0" stroke-width="3"/>
  <!-- 窗口顶栏分隔 -->
  <line x1="24" y1="44" x2="104" y2="44"
        stroke="#E2E8F0" stroke-width="3"/>
  <!-- 顶栏三个圆点（浏览器交通灯） -->
  <circle cx="34" cy="36" r="2.5" fill="#94A3B8"/>
  <circle cx="44" cy="36" r="2.5" fill="#94A3B8"/>
  <circle cx="54" cy="36" r="2.5" fill="#94A3B8"/>

  <!-- 罗盘指针：四向箭头汇聚于中心，琥珀色 -->
  <g stroke="#F59E0B" stroke-width="3.5" stroke-linecap="round" fill="none">
    <!-- 上 -->
    <line x1="64" y1="52" x2="64" y2="64"/>
    <polyline points="58,60 64,52 70,60"/>
    <!-- 下 -->
    <line x1="64" y1="64" x2="64" y2="88"/>
    <polyline points="58,82 64,88 70,82"/>
    <!-- 左 -->
    <line x1="64" y1="64" x2="36" y2="64"/>
    <polyline points="44,60 36,64 44,68"/>
    <!-- 右 -->
    <line x1="64" y1="64" x2="92" y2="64"/>
    <polyline points="84,60 92,64 84,68"/>
  </g>

  <!-- 中心圆点（领航核心） -->
  <circle cx="64" cy="64" r="4" fill="#F59E0B"/>
</svg>
