<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 170">
  <!--
    Helm — 横版 wordmark（README 头图 / banner）
    左侧：App 图标（深青圆角方块 + 白色 H）
    右侧：Helm 字标 + 副标
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0F766E"/>
      <stop offset="1" stop-color="#0B5F58"/>
    </linearGradient>
  </defs>

  <!-- 图标（左）— 与 extension icon 一致：深青方块 + 白色 H -->
  <g transform="translate(16,16)">
    <rect x="4" y="4" width="120" height="120" rx="24" fill="url(#bg)"/>
    <text x="64" y="92" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
          font-size="80" font-weight="800" fill="#FFFFFF" text-anchor="middle">H</text>
  </g>

  <!-- 字标（右） -->
  <g transform="translate(160,0)">
    <text x="0" y="100" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
          font-size="72" font-weight="700" fill="#0F766E" letter-spacing="-2">Helm</text>
    <text x="4" y="140" font-family="ui-sans-serif, system-ui, sans-serif"
          font-size="20" font-weight="500" fill="#64748B">Pilot your web.</text>
    <rect x="4" y="150" width="120" height="4" rx="2" fill="#F59E0B"/>
  </g>
</svg>
